name: pre-commit
description: Runs pre-commit hooks

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup R
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: "4.6"
        # Disable RSPM override so that we ensure we download packages from the
        # exact same sources as recorded in the lockfile for R pre-commit hooks
        use-public-rspm: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.2

    - name: Install pre-commit
      run: uv tool install pre-commit
      shell: bash

    - name: Cache pre-commit environment
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.1.0
      with:
        path: |
          ~/.cache/pre-commit
          ~/.cache/R
          ~/.local/share/renv/cache
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: pre-commit run --show-diff-on-failure --color=always --all-files
      shell: bash
